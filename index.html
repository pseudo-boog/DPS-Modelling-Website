<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RE-ADD Modeler</title>
<meta name="description" content="RE-ADD Modeler in the browser: fit kinetic mechanisms with re-additions to time-course data using COPASI's optimization methods, and compare models with statistics and F-tests.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232153c2'/%3E%3Cpath d='M6 22 C10 22 11 10 16 10 S21 18 26 18' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='9' cy='21' r='1.8' fill='white'/%3E%3Ccircle cx='16' cy='10' r='1.8' fill='white'/%3E%3Ccircle cx='23' cy='17' r='1.8' fill='white'/%3E%3C/svg%3E">
<style>
/* base reset */
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
/* Layout: lab-bench tool. A slim header with the three GUI tabs (Data, Model, Results);
   each tab is a two-column workbench (controls left, plot or output right) that stacks on phones. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --surface-2: #f7f8fb;
  --ink: #141922;
  --ink-2: #4a5262;
  --muted: #6c7484;
  --rule: #dde2ea;
  --rule-strong: #c4ccd8;
  --accent: #2153c2;
  --accent-ink: #ffffff;
  --accent-soft: #e5ecfb;
  --good: #0f7a3a;
  --good-soft: #e3f4ea;
  --warn: #8a5a00;
  --warn-soft: #fbf1db;
  --bad: #b42323;
  --bad-soft: #fbe6e6;
  --focus: #2153c2;
  --shadow: 0 1px 2px rgba(20, 25, 34, 0.06), 0 4px 16px rgba(20, 25, 34, 0.06);
  /* chart tokens (dataviz reference palette, light steps) */
  --chart-surface: #ffffff;
  --chart-grid: #e6e9ef;
  --chart-axis: #c4ccd8;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-head: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1116; --surface: #161a21; --surface-2: #1b2029; --ink: #e8ebf1; --ink-2: #b9c0cc; --muted: #8b94a4;
    --rule: #2a313c; --rule-strong: #3a4350; --accent: #7aa2ff; --accent-ink: #0b1020; --accent-soft: #1d2a47;
    --good: #5fd08f; --good-soft: #15301f; --warn: #f0be55; --warn-soft: #33290f; --bad: #ff8a8a; --bad-soft: #3a1717;
    --focus: #7aa2ff; --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 16px rgba(0, 0, 0, 0.3);
    --chart-surface: #161a21; --chart-grid: #262c36; --chart-axis: #3a4350;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1116; --surface: #161a21; --surface-2: #1b2029; --ink: #e8ebf1; --ink-2: #b9c0cc; --muted: #8b94a4;
  --rule: #2a313c; --rule-strong: #3a4350; --accent: #7aa2ff; --accent-ink: #0b1020; --accent-soft: #1d2a47;
  --good: #5fd08f; --good-soft: #15301f; --warn: #f0be55; --warn-soft: #33290f; --bad: #ff8a8a; --bad-soft: #3a1717;
  --focus: #7aa2ff; --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 16px rgba(0, 0, 0, 0.3);
  --chart-surface: #161a21; --chart-grid: #262c36; --chart-axis: #3a4350;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font-ui); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-underline-offset: 2px; }
a.btn { text-decoration: none; color: var(--ink); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-head); font-weight: 600; text-wrap: balance; margin: 0; }
code, .mono { font-family: var(--font-mono); font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--rule); }
.top-in { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1480px; margin: 0 auto; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: 8px; }
.brand h1 { font-size: 19px; letter-spacing: 0.01em; }
.brand .sub { color: var(--muted); font-size: 12px; }
.tabs { display: flex; gap: 2px; background: var(--surface-2); border: 1px solid var(--rule); border-radius: 8px; padding: 3px; }
.tab { border: 0; background: transparent; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: 500; color: var(--ink-2); display: flex; gap: 8px; align-items: center; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.tab .step { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.spacer { flex: 1; }
.session-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* page */
main { max-width: 1480px; margin: 0 auto; padding-block: 16px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bench { display: grid; grid-template-columns: minmax(320px, 420px) minmax(0, 1fr); gap: 16px; align-items: start; }
.bench.wide-left { grid-template-columns: minmax(340px, 520px) minmax(0, 1fr); }
.col { display: grid; gap: 16px; min-width: 0; }
.bench.model { grid-template-columns: minmax(0, 1fr) minmax(320px, 440px); }
.bench.results { grid-template-columns: minmax(260px, 330px) minmax(0, 1fr); }
@media (max-width: 920px) { .bench, .bench.wide-left, .bench.model, .bench.results { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; min-width: 0; }
.panel-h { display: flex; align-items: center; gap: 10px; padding: 12px 14px 10px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
.panel-h h2 { font-size: 15px; }
.panel-h .hint { color: var(--muted); font-size: 12px; }
.panel-b { padding: 12px 14px; display: grid; gap: 12px; min-width: 0; }
.eyebrow { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--rule-strong); background: var(--surface); padding: 6px 12px; border-radius: var(--r); cursor: pointer; font-weight: 500; white-space: nowrap; min-height: 32px; }
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.small { padding: 3px 8px; min-height: 26px; font-size: 12.5px; }
.btn.danger { color: var(--bad); }
.btn.big { min-height: 48px; font-size: 15px; width: 100%; }
.btn.on { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 12px; color: var(--ink-2); font-weight: 500; }
.input { border: 1px solid var(--rule-strong); background: var(--surface); border-radius: var(--r); padding: 6px 8px; min-height: 32px; width: 100%; min-width: 0; }
.input.mono { font-family: var(--font-mono); font-size: 13px; }
.input.invalid { border-color: var(--bad); background: var(--bad-soft); }
.input:disabled { opacity: 0.6; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 480px) { .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule-strong); border-radius: 999px; padding: 3px 10px 3px 8px; cursor: pointer; user-select: none; background: var(--surface); font-size: 13px; }
.chip input { position: absolute; opacity: 0; pointer-events: none; }
.chip .sw { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
.chip.off { color: var(--muted); border-style: dashed; }
.chip.off .sw { opacity: 0.25; }
.chip:focus-within { outline: 2px solid var(--focus); outline-offset: 1px; }
.check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.note { font-size: 12.5px; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--rule); border-radius: var(--r); padding: 8px 10px; }
.note.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.note.bad { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.note.good { background: var(--good-soft); border-color: transparent; color: var(--good); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--rule); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.run { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

/* lists & tables */
.list { display: grid; }
.item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r); cursor: pointer; border: 1px solid transparent; min-width: 0; }
.item:hover { background: var(--surface-2); }
.item[aria-selected="true"] { background: var(--accent-soft); border-color: transparent; }
.item .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.item .meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
.item .grow { flex: 1; min-width: 0; display: grid; }
.tablewrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--r); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th { font-weight: 600; color: var(--ink-2); background: var(--surface-2); font-size: 12px; position: sticky; top: 0; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-mono); font-size: 12.5px; }
tr:last-child td { border-bottom: 0; }
tr.best td { background: var(--accent-soft); }

/* reaction editor */
.rx { display: grid; grid-template-columns: 22px minmax(0, 1fr) 86px 86px 28px; gap: 6px; align-items: center; }
.rx .idx { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); text-align: right; }
.rx-head { font-size: 11.5px; color: var(--muted); font-weight: 600; }
@media (max-width: 480px) { .rx { grid-template-columns: 18px minmax(0, 1fr) 64px 64px 26px; } }

/* drop zone */
.drop { border: 1.5px dashed var(--rule-strong); border-radius: 10px; padding: 14px; text-align: center; color: var(--ink-2); display: grid; gap: 6px; justify-items: center; background: var(--surface-2); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop strong { color: var(--ink); }

/* plot */
.plot { width: 100%; height: 440px; min-width: 0; }
@media (max-width: 600px) { .plot { height: 320px; } }
.plot-empty { height: 300px; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 16px; }

/* sb string */
.sb { margin: 0; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.55; background: var(--surface-2); border: 1px solid var(--rule); border-radius: var(--r); padding: 10px 12px; overflow: auto; max-height: 460px; white-space: pre; tab-size: 4; }
.sb .ev { color: var(--accent); }
.sb .fx { color: var(--muted); }

/* progress */
.bar { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--rule); }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.2s; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }

/* modal & toast */
.scrim { position: fixed; inset: 0; background: rgba(10, 14, 20, 0.45); z-index: 30; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow); width: min(720px, 100%); max-height: calc(100vh - 32px); overflow: auto; display: grid; }
.modal .panel-h { position: sticky; top: 0; background: var(--surface); z-index: 1; }
.toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; z-index: 40; max-width: min(420px, calc(100vw - 32px)); }
.toast { background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; box-shadow: var(--shadow); font-size: 13px; }
.toast.bad { background: var(--bad); color: #fff; }
.banner { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 12px; margin-bottom: 16px; font-size: 13px; }
.banner .btn { color: var(--ink); }
details > summary { cursor: pointer; font-weight: 500; color: var(--ink-2); }
.kgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.kcell { border: 1px solid var(--rule); border-radius: var(--r); padding: 6px 10px; display: grid; gap: 2px; }
.kcell .kn { font-family: var(--font-mono); font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.kcell .kv { font-family: var(--font-mono); font-size: 14px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>

</head>
